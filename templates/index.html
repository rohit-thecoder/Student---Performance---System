<!DOCTYPE html>
<html class="no-js">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>Home Page</title>
    <meta name="description" content="Home Page">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        /* Reset default margin */
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Main container styling */
        .container {
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        /* Heading styling */
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
        }

        /* Paragraph styling */
        .browsehappy {
            color: red;
            font-size: 14px;
        }

        .browsehappy a {
            color: blue;
            text-decoration: none;
            font-weight: bold;
        }

        .browsehappy a:hover {
            text-decoration: underline;
        }
        .btn {
    padding: 12px 20px;
    font-size: 16px;
    background: #4facfe;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background: #00c6ff;
}
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome to the home page.</h1>

        <!--[if lt IE 7]>
            <p class="browsehappy">
                You are using an <strong>outdated</strong> browser.

            </p>
        <![endif]-->
        <div style="text-align:center; margin-top: 20px;">

    </a>
</div>
    </div>

</body>
</html>
